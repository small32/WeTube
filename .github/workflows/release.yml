name: Release

# 打 v* tag 自动构建并发布；也可以在 Actions 页面手动指定 tag 触发
# （留空 = 仓库里最新的 tag），用来给已存在的 Release 补产物。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建并发布的 tag（留空 = 最新 tag）'
        required: false
        type: string

# 默认只读。写权限按最小化原则单独下放给真正需要它的 publish job——
# prepare/windows/macos 都会执行第三方 build script 与 curl 外部二进制，
# 让它们默认持有 contents: write 属于不必要的纵深防御缺口。
permissions:
  contents: read

concurrency:
  group: "release-${{ github.event.inputs.tag || github.ref_name }}"
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # 构建脚本默认会自动追 yt-dlp 最新 stable 并改写自身的 pin 后重入构建。
  # Release 要可复现，这里关掉，只用脚本里 pin 死的版本（哈希校验照旧生效）。
  YTDLP_AUTO_UPDATE: '0'

jobs:
  prepare:
    name: 解析版本
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 解析 tag 与版本号
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG="$GITHUB_REF_NAME"
          elif [ -n "${INPUT_TAG:-}" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$(git describe --tags --abbrev=0)"
          fi
          # 确认 tag 真的存在（gh release create --verify-tag 也依赖这点）。
          git rev-parse --verify "refs/tags/${TAG}^{commit}" >/dev/null
          # 版本号唯一来源是 Cargo.toml 的 [package].version，与 build-macos-app.sh 一致。
          # 注意：这里不能用 `| head -1` 截断——pipefail 下上游会吃到 SIGPIPE 而让整步失败。
          # 让 sed 自己跑完，再用参数展开取第一行。
          VERSION="$(git show "$TAG:Cargo.toml" | sed -n 's/^version *= *"\(.*\)"/\1/p')"
          VERSION="${VERSION%%$'\n'*}"
          [ -n "$VERSION" ] || { echo "无法从 $TAG 的 Cargo.toml 解析版本号"; exit 1; }
          # tag 与 Cargo.toml 版本必须严格一致：只警告的话会出现
          # tag v3.1.0 而资产叫 WeTube-3.0.7-*.zip 的错配，用户下载到的东西
          # 与 Release 标题对不上，事后很难查。直接失败。
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG 与 Cargo.toml 版本 $VERSION 不一致（应为 v$VERSION）"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "解析结果：tag=$TAG  version=$VERSION"

  verify:
    name: 回归验证
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: 安装依赖
        run: npm ci

      # 发布前的硬门禁：前端回归不过就不许构建产物。
      # （Rust 侧的单测在 windows job 里跑，那边才有真实的内嵌工具载荷。）
      - name: 跑 scripts/verify-*.js
        run: npm run verify

  windows:
    name: Windows x64
    needs: [prepare, verify]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          # vendor/*.xz 是 Git LFS 托管的内嵌工具载荷，必须真正拉下来，
          # 否则 include_bytes! 会把 134 字节的 LFS 指针文件打进 exe。
          lfs: true

      - name: 校验 LFS 内嵌工具已展开
        shell: pwsh
        run: |
          $expect = @{
            'vendor/ffmpeg.exe.xz' = 1MB
            'vendor/yt-dlp.exe.xz' = 1MB
            'vendor/qjs.exe.xz'    = 100KB
          }
          # xz 容器的固定魔数：FD 37 7A 58 5A 00。
          # 光看体积挡得住 130 字节的 LFS 指针，挡不住"体积够大的错误内容"
          # （比如把一个解压后的 exe 误当成 .xz 传上来），补一条魔数校验。
          $xzMagic = '253,55,122,88,90,0'
          foreach ($f in $expect.Keys) {
            if (-not (Test-Path $f)) { throw "缺少 $f" }
            $len = (Get-Item $f).Length
            if ($len -lt $expect[$f]) { throw "$f 只有 $len 字节，疑似 Git LFS 指针未展开" }
            $fs = [System.IO.File]::OpenRead((Resolve-Path $f))
            try {
              $buf = New-Object byte[] 6
              $null = $fs.Read($buf, 0, 6)
            } finally { $fs.Close() }
            if (($buf -join ',') -ne $xzMagic) {
              throw "$f 的头部不是 xz 魔数（$($buf -join ',')），内容可疑"
            }
            Write-Host ("{0}  {1:N0} 字节  xz✓" -f $f, $len)
          }

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      # 先跑测试再构建：内嵌工具的真实解压/执行测试只有这里能跑。
      - name: 跑 Rust 测试
        run: cargo test --locked -j 2

      - name: 构建
        run: cargo build --release --locked

      - name: 打包
        shell: pwsh
        run: |
          $exe = 'target/release/WeTube.exe'
          if (-not (Test-Path $exe)) { throw "未生成 $exe" }
          $len = (Get-Item $exe).Length
          # 内嵌的 xz 载荷是原样 include_bytes! 进 exe 的，所以 exe 体积必然
          # ≥ 三个 .xz 之和。按实际求和来判断"有没有少嵌一个"——
          # 固定阈值（原来写死 20MB）只能发现"全都没嵌"，少一个照样放过。
          $embedded = (Get-ChildItem vendor/*.xz | Measure-Object -Property Length -Sum).Sum
          Write-Host ("WeTube.exe  {0:N0} 字节；内嵌载荷应 ≥ {1:N0} 字节" -f $len, $embedded)
          if ($len -le $embedded) {
            throw "WeTube.exe 只有 $len 字节，小于内嵌工具载荷总和 $embedded，疑似有工具未打进包"
          }
          Compress-Archive -Path $exe `
            -DestinationPath "WeTube-${{ needs.prepare.outputs.version }}-windows-x64.zip" `
            -CompressionLevel Optimal

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: WeTube-*-windows-x64.zip
          if-no-files-found: error
          # 产物内部已是压缩态，再压一遍纯属浪费。
          compression-level: 0

  macos:
    name: macOS ${{ matrix.label }}
    needs: [prepare, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            label: arm64
            asset: macos-arm64
          # macos-13 已被 GitHub 退役，Intel runner 现在是 macos-15-intel。
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            label: x64
            asset: macos-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: ${{ matrix.label }}

      # bundle-macos-libs.py 的传递依赖重定位逻辑有纯 Python 单测（Darwin 专属，
      # 用临时 dylib 验证 @rpath 改写后不依赖原库）。它不需要任何系统权限，
      # 最适合放在这里跑——以前全仓没有任何调用方，等于死代码。
      - name: 验证 dylib 打包逻辑
        run: python3 scripts/test-bundle-macos-libs.py

      # build-macos-app.sh 对 arm64 会自己下载 pin 死哈希的 ffmpeg/qjs；
      # 但 Intel 分支要求 PATH 里已有 x86_64 的 ffmpeg 与 qjs，这里备好。
      #
      # ffmpeg 的 URL/哈希不在本文件里重复一遍：脚本头部是唯一真源，
      # 这里 `source` 出那两对常量。以前两边各写一份，上游换版本时要改两处，
      # 漏一处就是"下载的 URL 与校验的哈希对不上"这种最难查的失败。
      # （osxexperts 的地址不带版本号，上游发新版会原地替换同名文件。）
      - name: 准备 Intel(x86_64) 外置工具
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          set -euo pipefail
          TOOLS="$RUNNER_TEMP/wetube-tools"
          mkdir -p "$TOOLS"
          # ffmpeg 的地址与哈希只在 scripts/build-macos-app.sh 头部定义一处，这里抽出来复用，
          # 避免 workflow 里再抄一份、两边漂移。用 sed 取 `VAR="${VAR:-默认值}"` 里的默认值，
          # **不要**用 `source <(...)`：进程替换依赖 bash 特性，在 runner 的 shell 下会静默拿到
          # 空值（v3.0.8 首跑即因此 exit 1），sed 在任何 POSIX shell 下都稳。
          extract_pin() {
            sed -n "s/^$1=\"\${$1:-\(.*\)}\"$/\1/p" scripts/build-macos-app.sh | head -n 1
          }
          FFMPEG_INTEL_URL="$(extract_pin FFMPEG_INTEL_URL)"
          FFMPEG_INTEL_SHA256="$(extract_pin FFMPEG_INTEL_SHA256)"
          if [ -z "$FFMPEG_INTEL_URL" ] || [ -z "$FFMPEG_INTEL_SHA256" ]; then
            echo "::error::没能从 scripts/build-macos-app.sh 抽出 FFMPEG_INTEL_*，请检查该文件头部的定义格式"
            grep -n 'FFMPEG_INTEL' scripts/build-macos-app.sh || true
            exit 1
          fi
          echo "使用 ffmpeg pin：$FFMPEG_INTEL_URL"
          # ffmpeg：osxexperts 的 Intel 静态构建（与 arm 版同源，无外部 dylib 依赖）。
          # 注意这个哈希属于**下载的 zip**，不是解出来的 ffmpeg。
          curl -fL --retry 3 -o "$RUNNER_TEMP/ffmpeg80intel.zip" "$FFMPEG_INTEL_URL"
          echo "$FFMPEG_INTEL_SHA256  $RUNNER_TEMP/ffmpeg80intel.zip" | shasum -a 256 -c -
          unzip -o -j -q "$RUNNER_TEMP/ffmpeg80intel.zip" ffmpeg -d "$TOOLS"
          # qjs：QuickJS-NG，与构建脚本 pin 的 0.16.2 同版本。
          curl -fL --retry 3 -o "$TOOLS/qjs" \
            "https://github.com/quickjs-ng/quickjs/releases/download/v0.16.2/qjs-darwin-x86_64"
          echo "4448991c0500dbe40c7b2f91ba39275995413aa4ee59db3b513b68350908a413  $TOOLS/qjs" \
            | shasum -a 256 -c -
          chmod +x "$TOOLS/ffmpeg" "$TOOLS/qjs"
          # lipo -archs 只接受单个输入文件，两个要分开查。
          for t in ffmpeg qjs; do
            printf '  %s -> ' "$t"
            lipo -archs "$TOOLS/$t"
          done
          echo "$TOOLS" >> "$GITHUB_PATH"

      - name: 构建 .app
        run: |
          set -euo pipefail
          rustup target add "${{ matrix.target }}"
          ./scripts/build-macos-app.sh "${{ matrix.target }}"

      - name: 打包
        run: |
          set -euo pipefail
          APP="target/${{ matrix.target }}/release/WeTube.app"
          test -d "$APP" || { echo "未生成 $APP"; exit 1; }
          echo "--- 签名信息 ---"
          codesign -dv "$APP"
          # 硬校验：build-macos-app.sh 里 codesign 已经改成失败即中止，
          # 这里再验一次最终产物——签名结构损坏的 .app 发布出去就是双击打不开。
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "--- 内嵌工具 ---"
          ls -l "$APP/Contents/Resources/bin"
          # 用 ditto 保留 .app 的目录结构与权限位，zip 解开即可直接运行。
          ditto -c -k --keepParent "$APP" \
            "WeTube-${{ needs.prepare.outputs.version }}-${{ matrix.asset }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: WeTube-*-${{ matrix.asset }}.zip
          if-no-files-found: error
          compression-level: 0

  publish:
    name: 发布 Release
    needs: [prepare, windows, macos]
    runs-on: ubuntu-latest
    # 只有这一步需要写权限（gh release create/upload）。
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          ls -lh dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，补充/覆盖资产"
            gh release upload "$TAG" dist/* --clobber
          else
            echo "创建 Release $TAG"
            gh release create "$TAG" dist/* --verify-tag \
              --title "WeTube $VERSION" --generate-notes
          fi
          echo "--- 当前 Release 资产 ---"
          gh release view "$TAG" --json tagName,assets \
            --jq '.tagName, (.assets[] | "  " + .name + "  " + (.size|tostring) + " bytes")'
